name: Push Docker Image

on:
  workflow_dispatch:
  
  push:
    branches:
      - main

jobs:
  quality-gate:
    uses: ./.github/workflows/testing.yml

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: tag
        run: |
          DATE_TAG=$(date +'%y.%m.%d')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "TAG=${DATE_TAG}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:'"$TAG" -t '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest' .

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:'"$TAG"
          docker push '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest'
