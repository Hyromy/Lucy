name: Deploy in VPS

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Push Docker Image"]
    types:
      - completed

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_TOKEN }}" | \
              docker login -u "${{ vars.DOCKER_USER }}" --password-stdin
            
            docker stop ${{ vars.DOCKER_CONTAINER }} || true
            docker rm ${{ vars.DOCKER_CONTAINER }} || true
            docker rmi -f ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest || true
            docker pull ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest
            docker run -d --name '${{ vars.DOCKER_CONTAINER }}' \
              -e 'PRODUCTION=True' \
              -e 'DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}' \
              -e 'API_REST=${{ vars.API_REST }}' \
              -e 'RELEASES_URL=${{ vars.RELEASES_URL }}' \
              '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest'
